<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#F6F3EE;color:#16130F;font-family:'Golos Text',system-ui,sans-serif;position:relative}
  .bar{position:absolute;left:0;right:0;top:0;height:6px;background:#16130F}
  .brand{position:absolute;left:72px;top:56px;display:flex;align-items:center;gap:16px;font-weight:800;font-size:30px;letter-spacing:-.02em}
  .brand img{width:40px;height:40px}
  .eyebrow{position:absolute;right:72px;top:62px;font-size:22px;color:#655E54}
  h1{position:absolute;left:72px;top:170px;margin:0;font-size:104px;line-height:.94;letter-spacing:-.04em;font-weight:800}
  h1 span{display:block}
  h1 span:nth-child(2){margin-left:120px}
  h1 span:nth-child(3){margin-left:40px;color:#1F3BE6}
  .foot{position:absolute;left:72px;right:72px;bottom:52px;display:flex;justify-content:space-between;font-size:24px;color:#655E54;border-top:2px solid #16130F;padding-top:22px}
</style>
</head>
<body>
<div class="bar"></div>
<div class="brand"><img src="img/mark.svg" alt=""><span>ReShape</span></div>
<div class="eyebrow">Пилот, восемь мест</div>
<h1><span>Ты снова принимаешь</span><span>новое решение</span><span>из старой точки.</span></h1>
<div class="foot"><span>Разбор одного повторяющегося сценария</span><span>для предпринимателей и экспертов</span></div>
</body>
</html>
